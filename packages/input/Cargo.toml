[package]
name = "glance-input"
version = "0.0.0"
edition = "2021"
description = "Native macOS mouse helper for Glance (JSON lines over stdin/stdout)"

[[bin]]
name = "glance-input"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
