[project]
name = "glance-lab"
version = "0.1.0"
description = "Glance benchmark and training: crawl, dataset, systems, stats, LoRA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "playwright>=1.47",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pillow>=10",
    "pydantic>=2.8",
    "tqdm>=4.66",
    "pytest>=8",
    "fireworks-ai[training]",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glance_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
