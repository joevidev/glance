<!doctype html>
<meta charset="utf-8">
<title>Glance typing test page</title>
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 28px 36px; background: #fff; color: #111; }
  .mail { border: 1px solid #ddd; border-radius: 12px; padding: 16px 20px; max-width: 640px; }
  .mail h2 { margin: 0 0 6px; font-size: 18px; }
  textarea, input { width: 100%; box-sizing: border-box; font: inherit; padding: 12px 14px; border: 2px solid #111; border-radius: 10px; margin-top: 14px; }
</style>
<h1>Inbox</h1>
<div class="mail" id="mail">
  <h2>Re: Dinner on Friday?</h2>
  <p><b>Maya:</b> Hi! Are you free for dinner this Friday at 7pm? I was thinking the new Italian place near the park.</p>
</div>
<label for="field">Reply</label>
<input id="field" placeholder="Write a reply" autocomplete="off" spellcheck="false">
